<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #000;
        }
        .form-container {
            background-color: #f0f0f0;
            max-width: 800px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            font-weight: bold;
            font-size: 18px;
            margin-right: 10px;
        }
        .required:after {
            content: "*";
            color: red;
            margin-left: 3px;
        }
        input[type="text"] {
            width: 200px;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .required-text {
            display: inline-block;
            margin-left: 10px;
            color: #000;
        }
        button {
            background-color: #f0f0f0;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .error {
            background-color: #ffebee;
            border: 1px solid #f44336;
            color: #d32f2f;
        }
        .success {
            background-color: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Please verify your email address</h1>
        <form id="emailForm">
            <div class="form-group">
                <label for="email" class="required">Email Address:</label>
                <input type="text" id="email" name="email">
                <span class="required-text">This field is required.</span>
            </div>
            <div class="form-group">
                <label for="confirmEmail" class="required">Confirm Email Address:</label>
                <input type="text" id="confirmEmail" name="confirmEmail">
                <span class="required-text">This field is required.</span>
            </div>
            <button type="button" id="confirmButton">Confirm</button>
            <div id="message"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
