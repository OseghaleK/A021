<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #000;
        }
        .form-container {
            background-color: #f0f0f0;
            max-width: 800px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            font-weight: bold;
            font-size: 18px;
            margin-right: 10px;
        }
        input[type="text"] {
            width: 200px;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .required-text {
            display: inline-block;
            margin-left: 10px;
            color: #000;
        }
        button {
            background-color: #f0f0f0;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        .error-message {
            color: #d93025;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            color: #1e8e3e;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .error-border {
            border-color: #d93025 !important;
        }
        .success-border {
            border-color: #1e8e3e !important;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Please verify your email address</h1>
        <form id="emailForm">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email" name="email" value="I">
                <span class="required-text">This field is required.</span>
                <div id="emailError" class="error-message">Please enter a valid email address.</div>
            </div>
            <div class="form-group">
                <label for="confirmEmail">Confirm Email Address:</label>
                <input type="text" id="confirmEmail" name="confirmEmail">
                <span class="required-text">This field is required.</span>
                <div id="confirmEmailError" class="error-message">Email addresses do not match.</div>
            </div>
            <button type="button" id="confirmButton">Confirm</button>
            <div id="successMessage" class="success-message">Email verified successfully!</div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
